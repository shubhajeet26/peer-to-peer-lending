[package]
name = "loan_manager"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
reputation_registry = { path = "../reputation_registry" }

[features]
testutils = ["soroban-sdk/testutils"]
